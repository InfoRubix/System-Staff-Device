[build]
  # Build command for Next.js with serverless functions
  command = "npm run build"
  # Output directory for Next.js (not static export)
  publish = ".next"

# Enable Next.js plugin for API routes and serverless functions
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers (same as public/_headers but as backup)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Strict-Transport-Security forces HTTPS
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://your-domain.netlify.app/*"
  to = "https://your-domain.netlify.app/:splat"
  status = 301
  force = true
